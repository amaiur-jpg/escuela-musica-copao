    // Cálculo exacto de edad
    function calcularEdad(fechaNacStr) {
      if (!fechaNacStr) return 0;
      const partes = fechaNacStr.split('-').map(Number);
      if (partes.length !== 3) return 0;
      const [year, month, day] = partes;
      const hoy = new Date();
      let edad = hoy.getFullYear() - year;
      const m = (hoy.getMonth() + 1) - month;
      if (m < 0 || (m === 0 && hoy.getDate() < day)) {
        edad--;
      }
      return edad;
    }

      // Una lista guardada vacía no equivale a una primera visita."
      useEffect(() => {

        if (guardado === null) {
          // Primera visita absoluta
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEMILLA_INICIAL));
          setAlumnos(SEMILLA_INICIAL);
        } else {
          try {
            const parsed = JSON.parse(guardado);
            setAlumnos(Array.isArray(parsed) ? parsed : []);
          } catch (e) {
            setAlumnos([]);
          }
        }
      }, []);

        if (window.lucide) {

      });

        setToast({ mensaje, tipo });
        setTimeout(() => setToast(null), 3500);
      }

      // Guardar en LocalStorage con verificación de fallo
      function guardarAlumnos(nuevaLista) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nuevaLista));
          setAlumnos(nuevaLista);
          return true;
        } catch (error) {
          showToast("Error de almacenamiento local. No se pudieron guardar los cambios.", "error");
          return false;
        }

        if (claveInput === CLAVE_PANEL) {

      const metricasCupos = useMemo(() => {
        return INSTRUMENTOS.map(inst => {
          const inscritos = alumnos.filter(a => a.instrumento === inst.nombre && (a.estado === 'Activo' || a.estado === 'Congelado'));

          const libres = Math.max(0, inst.cupo - ocupados);
          const lleno = libres === 0;
          const ultimos = !lleno && libres <= 3;
          return {
            ...inst,
            ocupados,
            libres,
            lleno,
            ultimos,
            porcentaje: Math.min(100, (ocupados / inst.cupo) * 100)
          };
        });

                <button
                  onClick={() => { setAlumnoEditando(null); setVista('formulario'); }}
                  className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold bg-brand-mustard text-brand-navy hover:brightness-105 shadow-sm transition"
                >
                  <i data-lucide="plus" className="w-4 h-4"></i>
                  <span>Nuevo Alumno</span>
                </button>

                <button
                  onClick={handleLogout}
                  title="Cerrar sesión"
                  className="p-2 rounded-lg text-brand-charcoal/60 hover:text-brand-rust hover:bg-brand-subtle transition ml-1"
                >
                  <i data-lucide="log-out" className="w-4 h-4"></i>
                </button>
              </nav>

            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 pb-20">
            {vista === 'panel' && (
              <VistaPanel
                metricas={metricasCupos}
                ingresoTotal={ingresoMensualEstimado}
                activos={totalActivos}
                congelados={totalCongelados}
                retirados={totalRetirados}
                onNuevo={() => { setAlumnoEditando(null); setVista('formulario'); }}
                onRestaurar={() => setModalRestaurar(true)}
              />
            )}

            {vista === 'alumnos' && (
              <VistaAlumnos
                alumnos={alumnos}
                onNuevo={() => { setAlumnoEditando(null); setVista('formulario'); }}
                onEditar={(alum) => { setAlumnoEditando(alum); setVista('formulario'); }}
                onBorrar={(alum) => setModalBorrar(alum)}
                onCambiarEstado={(alumno, nuevoEstado) => {
                  // Comprobar si reactivar no viola el cupo
                  if (nuevoEstado === 'Activo' || nuevoEstado === 'Congelado') {
                    const inst = INSTRUMENTOS.find(i => i.nombre === alumno.instrumento);
                    const ocupados = alumnos.filter(a => a.instrumento === alumno.instrumento && a.id !== alumno.id && (a.estado === 'Activo' || a.estado === 'Congelado')).length;
                    if (inst && ocupados >= inst.cupo) {
                      showToast(`No se puede activar: ${alumno.instrumento} no tiene cupo disponible.`, "error");
                      return;
                    }
                  }
                  const actualizados = alumnos.map(a => a.id === alumno.id ? { ...a, estado: nuevoEstado } : a);
                  if (guardarAlumnos(actualizados)) {
                    showToast(`Estado de ${alumno.nombre} cambiado a ${nuevoEstado}`);
                  }
                }}
              />
            )}

            {vista === 'formulario' && (
              <VistaFormulario
                alumnoEditando={alumnoEditando}
                alumnosExistentes={alumnos}
                onGuardar={(alumnoData) => {
                  let nuevaLista;
                  if (alumnoEditando) {
                    nuevaLista = alumnos.map(a => a.id === alumnoEditando.id ? { ...a, ...alumnoData } : a);
                    showToast(`Ficha de ${alumnoData.nombre} ${alumnoData.apellido} actualizada`);
                  } else {
                    const nuevo = {
                      ...alumnoData,
                      id: "copao-" + Date.now(),
                      fechaAlta: new Date().toISOString().split('T')[0]
                    };
                    nuevaLista = [nuevo, ...alumnos];
                    showToast(`¡Alumno ${alumnoData.nombre} dado de alta con éxito!`);
                  }
                  if (guardarAlumnos(nuevaLista)) {
                    setVista('alumnos');
                  }
                }}
                onCancelar={() => setVista(alumnoEditando ? 'alumnos' : 'panel')}
              />
            )}
          </main>

          {/* BOTÓN FLOTANTE MÓVIL PARA NUEVO ALUMNO */}
          {vista !== 'formulario' && (
            <div className="sm:hidden fixed bottom-5 right-5 z-20">
              <button
                onClick={() => { setAlumnoEditando(null); setVista('formulario'); }}
                className="w-14 h-14 rounded-full bg-brand-mustard text-brand-navy shadow-lg flex items-center justify-center font-bold text-2xl border-2 border-brand-navy active:scale-95 transition"
              >
                <i data-lucide="plus" className="w-6 h-6"></i>
              </button>
            </div>
          )}

          {/* MODAL DE CONFIRMACIÓN: RESTAURAR SEMILLA */}
          {modalRestaurar && (
            <div className="fixed inset-0 bg-brand-charcoal/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-brand-paper rounded-2xl max-w-md w-full p-6 border border-brand-border shadow-xl animate-modal space-y-4">
                <div className="w-12 h-12 rounded-full bg-brand-mustard/20 text-brand-mustard flex items-center justify-center font-bold">
                  <i data-lucide="refresh-cw" className="w-6 h-6"></i>
                </div>
                <h3 className="font-music text-xl font-bold text-brand-navy">
                  ¿Restaurar los datos de ejemplo?
                </h3>
                <p className="text-sm text-brand-charcoal/80 leading-relaxed">
                  Se reemplazarán todas las fichas actuales por las <strong>30 fichas sintéticas originales</strong> (Batería 8 de 8 llena, Violín 8 de 10, congelados y retirados). Esta acción no se puede deshacer.
                </p>
                <div className="flex justify-end gap-3 pt-2">
                  <button
                    onClick={() => setModalRestaurar(false)}
                    className="px-4 py-2 text-sm font-medium text-brand-charcoal/70 hover:bg-brand-subtle rounded-lg"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={ejecutarRestauracion}
                    className="px-4 py-2 text-sm font-semibold bg-brand-navy text-brand-paper rounded-lg hover:bg-brand-navy/90"
                  >
                    Restaurar datos
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIRMACIÓN: BORRAR FICHA */}
          {modalBorrar && (
            <div className="fixed inset-0 bg-brand-charcoal/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-brand-paper rounded-2xl max-w-md w-full p-6 border border-brand-border shadow-xl animate-modal space-y-4">
                <div className="w-12 h-12 rounded-full bg-brand-rust/10 text-brand-rust flex items-center justify-center font-bold">
                  <i data-lucide="trash-2" className="w-6 h-6"></i>
                </div>
                <h3 className="font-music text-xl font-bold text-brand-navy">
                  ¿Eliminar ficha de alumno?
                </h3>
                <p className="text-sm text-brand-charcoal/80 leading-relaxed">
                  Vas a eliminar la ficha de <strong>{modalBorrar.nombre} {modalBorrar.apellido}</strong> ({modalBorrar.instrumento}). Esta acción libera su lugar en el instrumento de inmediato.
                </p>
                <div className="flex justify-end gap-3 pt-2">
                  <button
                    onClick={() => setModalBorrar(null)}
                    className="px-4 py-2 text-sm font-medium text-brand-charcoal/70 hover:bg-brand-subtle rounded-lg"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={confirmarBorrado}
                    className="px-4 py-2 text-sm font-semibold bg-brand-rust text-white rounded-lg hover:brightness-110"
                  >
                    Sí, eliminar ficha
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST FLOTANTE */}
          {toast && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 animate-modal">
              <div className={`px-4 py-2.5 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-2 ${
                toast.tipo === 'error'
                  ? 'bg-brand-rust text-white border-brand-rust/30'
                  : 'bg-brand-navy text-brand-paper border-brand-navy/30'
              }`}>
                <i data-lucide={toast.tipo === 'error' ? 'alert-triangle' : 'check-circle'} className="w-4 h-4"></i>
                <span>{toast.mensaje}</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================================================
    // PANTALLA 3: LISTADO DE ALUMNOS (Buscador y filtros combinables)
    // ==========================================================================
    function VistaAlumnos({ alumnos, onNuevo, onEditar, onBorrar, onCambiarEstado }) {
      const [busqueda, setBusqueda] = useState("");
      const [filtroInstrumento, setFiltroInstrumento] = useState("todos");
      const [filtroEstado, setFiltroEstado] = useState("todos");

      // Filtrado conjunto: buscador + instrumento + estado
      const filtrados = useMemo(() => {
        const query = busqueda.trim().toLowerCase();
        return alumnos.filter(a => {
          const coincideTexto = !query ||
            a.nombre.toLowerCase().includes(query) ||
            a.apellido.toLowerCase().includes(query) ||
            (a.correo && a.correo.toLowerCase().includes(query));
          
          const coincideInstrumento = filtroInstrumento === "todos" || a.instrumento === filtroInstrumento;
          const coincideEstado = filtroEstado === "todos" || a.estado === filtroEstado;

          return coincideTexto && coincideInstrumento && coincideEstado;
        });
      }, [alumnos, busqueda, filtroInstrumento, filtroEstado]);

      return (
        <div className="space-y-4">
          
          {/* Cabecera de la sección */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 pb-1">
            <div>
              <h2 className="font-music font-bold text-2xl text-brand-navy">
                Fichas de Alumnos
              </h2>
              <p className="text-xs text-brand-charcoal/60">
                Mostrando {filtrados.length} de {alumnos.length} alumnos registrados
              </p>
            </div>
          </div>

          {/* BARRA DE BÚSQUEDA Y FILTROS COMBINABLES */}
          <div className="bg-brand-paper rounded-xl p-3.5 border border-brand-border shadow-xs grid grid-cols-1 sm:grid-cols-3 gap-3">
            
            {/* Buscador */}
            <div className="relative">
              <i data-lucide="search" className="w-4 h-4 text-brand-charcoal/40 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                placeholder="Buscar por nombre, apellido o correo…"
                className="w-full pl-9 pr-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard text-brand-charcoal"
              />
            </div>

            {/* Filtro por Instrumento */}
            <div>
              <select
                value={filtroInstrumento}
                onChange={(e) => setFiltroInstrumento(e.target.value)}
                className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard text-brand-charcoal"
              >
                <option value="todos">Todos los instrumentos ({alumnos.length})</option>
                {INSTRUMENTOS.map(i => (
                  <option key={i.id} value={i.nombre}>
                    {i.nombre} ({alumnos.filter(a => a.instrumento === i.nombre).length})
                  </option>
                ))}
              </select>
            </div>

            {/* Filtro por Estado */}
            <div>
              <select
                value={filtroEstado}
                onChange={(e) => setFiltroEstado(e.target.value)}
                className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard text-brand-charcoal"
              >
                <option value="todos">Todos los estados</option>
                <option value="Activo">Solo Activos</option>
                <option value="Congelado">Solo Congelados</option>
                <option value="Retirado">Solo Retirados</option>
              </select>
            </div>

          </div>

          {/* LISTA DE ALUMNOS / ESTADO VACÍO */}
          {alumnos.length === 0 ? (
            <div className="bg-brand-paper rounded-2xl p-12 border border-brand-border text-center space-y-3">
              <div className="w-12 h-12 rounded-full bg-brand-subtle text-brand-navy/50 mx-auto flex items-center justify-center font-music text-xl">
                𝄞
              </div>
              <h3 className="font-music font-bold text-lg text-brand-navy">
                Todavía no hay alumnos cargados
              </h3>
              <p className="text-sm text-brand-charcoal/60 max-w-sm mx-auto">
                La secretaría está vacía. Puedes dar de alta un alumno o restaurar la semilla inicial de ejemplo.
              </p>
            </div>
          ) : filtrados.length === 0 ? (
            <div className="bg-brand-paper rounded-2xl p-10 border border-brand-border text-center space-y-2">
              <p className="font-medium text-brand-navy">Ningún alumno coincide con los filtros</p>
              <p className="text-xs text-brand-charcoal/60">
                Prueba a limpiar la búsqueda o cambiar el instrumento seleccionado.
              </p>
              <button
                onClick={() => { setBusqueda(""); setFiltroInstrumento("todos"); setFiltroEstado("todos"); }}
                className="text-xs text-brand-mustard font-bold underline mt-2 inline-block"
              >
                Restablecer filtros
              </button>
            </div>
          ) : (
            <div className="bg-brand-paper rounded-2xl border border-brand-border shadow-xs overflow-hidden divide-y divide-brand-border/60">
              {filtrados.map(alumno => {
                const edad = calcularEdad(alumno.fechaNacimiento);
                const esMenor = edad < 18;

                return (
                  <div key={alumno.id} className="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-brand-cream/30 transition">
                    
                    {/* Datos del alumno */}
                    <div className="space-y-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-bold text-base text-brand-navy">
                          {alumno.nombre} {alumno.apellido}
                        </span>
                        
                        {/* Badge de edad */}
                        <span className="text-xs px-2 py-0.5 rounded-full bg-brand-subtle text-brand-charcoal/70">
                          {edad} años {esMenor && '· Menor'}
                        </span>

                        {/* Badge de estado */}
                        <span className={`text-xs px-2 py-0.5 rounded font-bold ${
                          alumno.estado === 'Activo'
                            ? 'bg-brand-navy text-brand-paper'
                            : alumno.estado === 'Congelado'
                              ? 'bg-brand-mustard text-brand-navy'
                              : 'bg-brand-charcoal/20 text-brand-charcoal/70'
                        }`}>
                          {alumno.estado}
                        </span>
                      </div>

                      <div className="text-xs text-brand-charcoal/70 flex flex-wrap gap-x-3 gap-y-1">
                        <span className="font-semibold text-brand-navy">
                          ♫ {alumno.instrumento}
                        </span>
                        <span>
                          🗓 {alumno.dia} a las {alumno.hora} hs
                        </span>
                        <span className="text-brand-charcoal/50">
                          ✉ {alumno.correo}
                        </span>
                      </div>

                      {esMenor && alumno.adultoResponsable && (
                        <p className="text-xs text-brand-charcoal/60 italic">
                          Tutor/a: {alumno.adultoResponsable}
                        </p>
                      )}
                    </div>

                    {/* Acciones y cambio rápido de estado */}
                    <div className="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-0 border-brand-border/40">
                      
                      {/* Selector de estado rápido */}
                      <select
                        value={alumno.estado}
                        onChange={(e) => onCambiarEstado(alumno, e.target.value)}
                        className="text-xs font-semibold px-2 py-1.5 rounded-lg border border-brand-border bg-brand-paper text-brand-charcoal focus:outline-none focus:ring-1 focus:ring-brand-mustard"
                      >
                        <option value="Activo">Activo</option>
                        <option value="Congelado">Congelado</option>
                        <option value="Retirado">Retirado</option>
                      </select>

                      {/* Botón Editar */}
                      <button
                        onClick={() => onEditar(alumno)}
                        title="Editar ficha"
                        className="p-1.5 rounded-lg text-brand-charcoal/70 hover:text-brand-navy hover:bg-brand-subtle transition"
                      >
                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                      </button>

                      {/* Botón Borrar */}
                      <button
                        onClick={() => onBorrar(alumno)}
                        title="Borrar ficha"
                        className="p-1.5 rounded-lg text-brand-charcoal/70 hover:text-brand-rust hover:bg-brand-rust/10 transition"
                      >
                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                      </button>

                    </div>

                  </div>
                );
              })}
            </div>
          )}

        </div>
      );
    }

    // ==========================================================================
    // PANTALLA 4: FICHA DE ALUMNO (ALTA Y EDICIÓN)
    // Con regla de los 18 años y validación estricta de cupos
    // ==========================================================================
    function VistaFormulario({ alumnoEditando, alumnosExistentes, onGuardar, onCancelar }) {
      const [nombre, setNombre] = useState(alumnoEditando ? alumnoEditando.nombre : "");
      const [apellido, setApellido] = useState(alumnoEditando ? alumnoEditando.apellido : "");
      const [fechaNacimiento, setFechaNacimiento] = useState(alumnoEditando ? alumnoEditando.fechaNacimiento : "");
      const [adultoResponsable, setAdultoResponsable] = useState(alumnoEditando ? (alumnoEditando.adultoResponsable || "") : "");
      const [correo, setCorreo] = useState(alumnoEditando ? alumnoEditando.correo : "");
      const [instrumento, setInstrumento] = useState(alumnoEditando ? alumnoEditando.instrumento : "Piano");
      const [dia, setDia] = useState(alumnoEditando ? alumnoEditando.dia : "Lunes");
      const [hora, setHora] = useState(alumnoEditando ? alumnoEditando.hora : "15:00");
      const [estado, setEstado] = useState(alumnoEditando ? alumnoEditando.estado : "Activo");

      const [errorMensaje, setErrorMensaje] = useState("");

      // Generador automático de correo oficial example.com a partir de nombre y apellido
      function generarCorreoSugerido(nom, ape) {
        if (!nom || !ape) return "";
        const clean = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const cNom = clean(nom.trim());
        const cApe = clean(ape.trim());
        if (!cNom || !cApe) return "";
        return `${cNom}.${cApe}@example.com`;
      }

      function handleNombreChange(val) {
        // Si Chrome o el usuario autocompleta el nombre completo (ej: "Begoña Garjón Hernández")
        const trimmed = val.trim();
        const primerEspacio = trimmed.indexOf(" ");
        if (primerEspacio > 0 && !apellido) {
          const primerNombre = trimmed.slice(0, primerEspacio);
          const restoApellidos = trimmed.slice(primerEspacio + 1);
          setNombre(primerNombre);
          setApellido(restoApellidos);
          if (!alumnoEditando && (!correo || correo.endsWith("@example.com"))) {
            const sug = generarCorreoSugerido(primerNombre, restoApellidos);
            if (sug) setCorreo(sug);
          }
          return;
        }

        setNombre(val);
        // Autocompletar el correo si estamos en alta y el correo está vacío o es un example.com previo
        if (!alumnoEditando && (!correo || correo.endsWith("@example.com"))) {
          const sug = generarCorreoSugerido(val, apellido);
          if (sug) setCorreo(sug);
        }
      }

      function handleApellidoChange(val) {
        setApellido(val);
        // Autocompletar el correo si estamos en alta y el correo está vacío o es un example.com previo
        if (!alumnoEditando && (!correo || correo.endsWith("@example.com"))) {
          const sug = generarCorreoSugerido(nombre, val);
          if (sug) setCorreo(sug);
        }
      }

      // Cálculo de edad dinámico
      const edad = useMemo(() => calcularEdad(fechaNacimiento), [fechaNacimiento]);
      const esMenor = fechaNacimiento ? edad < 18 : false;

      // Horarios disponibles para el día seleccionado
      const horariosDisponibles = useMemo(() => getHorariosPorDia(dia), [dia]);

      // Si cambia el día y la hora actual no existe en el nuevo día, ajustar al primer slot
      useEffect(() => {
        if (!horariosDisponibles.includes(hora)) {
          setHora(horariosDisponibles[0]);
        }
      }, [dia]);

      // Cupo actual del instrumento elegido
      const cupoInfo = useMemo(() => {
        const inst = INSTRUMENTOS.find(i => i.nombre === instrumento);
        if (!inst) return { libres: 0, lleno: true };
        
        // Excluimos al alumno actual si estamos editando y ya estaba ocupando plaza en este instrumento
        const ocupados = alumnosExistentes.filter(a => {
          if (alumnoEditando && a.id === alumnoEditando.id) return false;
          return a.instrumento === instrumento && (a.estado === 'Activo' || a.estado === 'Congelado');
        }).length;

        const libres = Math.max(0, inst.cupo - ocupados);
        return {
          total: inst.cupo,
          ocupados,
          libres,
          lleno: libres === 0,
          mensualidad: inst.mensualidad
        };
      }, [instrumento, alumnosExistentes, alumnoEditando]);

      function handleSubmit(e) {
        e.preventDefault();
        setErrorMensaje("");

        const nom = nombre.trim();
        const ape = apellido.trim();
        const mail = correo.trim().toLowerCase();

        if (!nom || !ape) {
          setErrorMensaje("Por favor, ingresa el nombre y apellido del alumno.");
          return;
        }

        if (!fechaNacimiento) {
          setErrorMensaje("Por favor, indica la fecha de nacimiento.");
          return;
        }

        // CRITERIO 2: Menores de 18 exigen adulto responsable
        if (esMenor && !adultoResponsable.trim()) {
          setErrorMensaje("Al ser menor de 18 años, es obligatorio indicar a la persona adulta responsable.");
          return;
        }

        if (!mail || !mail.includes('@')) {
          setErrorMensaje("Ingresa un correo electrónico válido (ejemplo: nombre@example.com).");
          return;
        }

        // Validación de correo duplicado
        const duplicado = alumnosExistentes.find(a => {
          if (alumnoEditando && a.id === alumnoEditando.id) return false;
          return a.correo.trim().toLowerCase() === mail;
        });
        if (duplicado) {
          setErrorMensaje(`Ya existe una ficha registrada con el correo ${mail}.`);
          return;
        }

        // CRITERIO 3 & 6: Con cupo cero no se puede guardar como Activo ni reactivar
        if ((estado === 'Activo' || estado === 'Congelado') && cupoInfo.lleno) {
          setErrorMensaje("No queda cupo en este instrumento.");
          return;
        }

        onGuardar({
          nombre: nom,
          apellido: ape,
          fechaNacimiento,
          adultoResponsable: esMenor ? adultoResponsable.trim() : null,
          correo: mail,
          instrumento,
          dia,
          hora,
          estado
        });
      }

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          
          <div className="border-b border-brand-border pb-3 flex items-center justify-between">
            <div>
              <h2 className="font-music font-bold text-2xl text-brand-navy">
                {alumnoEditando ? `Editar ficha: ${alumnoEditando.nombre} ${alumnoEditando.apellido}` : "Nueva Ficha de Alumno"}
              </h2>
              <p className="text-xs text-brand-charcoal/60 mt-0.5">
                {alumnoEditando ? "Actualiza los datos del alumno y su estado" : "Completa la ficha para registrar al estudiante"}
              </p>
            </div>
            {alumnoEditando && (
              <span className="text-xs bg-brand-subtle px-2.5 py-1 rounded-md text-brand-navy font-semibold">
                Alta: {alumnoEditando.fechaAlta}
              </span>
            )}
          </div>

          {/* ALERTA DE ERROR */}
          {errorMensaje && (
            <div className="p-3.5 rounded-xl bg-brand-rust/10 border border-brand-rust/30 text-brand-rust text-sm font-semibold flex items-center gap-2 animate-modal">
              <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
              <span>{errorMensaje}</span>
            </div>
          )}

          <form onSubmit={handleSubmit} className="bg-brand-paper rounded-2xl p-6 border border-brand-border shadow-xs space-y-5">
            
            {/* DATOS PERSONALES */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label htmlFor="input-nombre" className="block text-xs font-bold uppercase tracking-wider text-brand-navy mb-1.5">
                  Nombre
                </label>
                <input
                  id="input-nombre"
                  name="given-name"
                  autoComplete="name given-name"
                  type="text"
                  required
                  value={nombre}
                  onInput={(e) => handleNombreChange(e.target.value)}
                  onChange={(e) => handleNombreChange(e.target.value)}
                  placeholder="Ej: Amaro"
                  className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                />
              </div>

              <div>
                <label htmlFor="input-apellido" className="block text-xs font-bold uppercase tracking-wider text-brand-navy mb-1.5">
                  Apellido
                </label>
                <input
                  id="input-apellido"
                  name="family-name"
                  autoComplete="family-name additional-name"
                  type="text"
                  required
                  value={apellido}
                  onInput={(e) => handleApellidoChange(e.target.value)}
                  onChange={(e) => handleApellidoChange(e.target.value)}
                  placeholder="Ej: Gómez"
                  className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                />
              </div>
            </div>

            {/* FECHA DE NACIMIENTO Y CORREO ELECTRÓNICO */}
            <div className="space-y-3 pt-1">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label htmlFor="input-fechaNac" className="block text-xs font-bold uppercase tracking-wider text-brand-navy mb-1.5">
                    Fecha de nacimiento
                  </label>
                  <input
                    id="input-fechaNac"
                    name="bday"
                    autoComplete="bday"
                    type="date"
                    required
                    value={fechaNacimiento}
                    onChange={(e) => setFechaNacimiento(e.target.value)}
                    className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                  />
                  {fechaNacimiento && (
                    <p className="text-xs text-brand-charcoal/60 mt-1">
                      Edad calculada: <strong>{edad} años</strong> {esMenor ? '(menor de edad)' : '(adulto)'}
                    </p>
                  )}
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label htmlFor="input-correo" className="text-xs font-bold uppercase tracking-wider text-brand-navy">
                      Correo electrónico
                    </label>
                    {nombre && apellido && (
                      <button
                        type="button"
                        onClick={() => setCorreo(generarCorreoSugerido(nombre, apellido))}
                        className="text-[11px] text-brand-mustard hover:text-brand-navy font-bold underline transition"
                        title="Rellenar automáticamente como nombre.apellido@example.com"
                      >
                        Auto-generar correo
                      </button>
                    )}
                  </div>
                  <input
                    id="input-correo"
                    name="email"
                    autoComplete="email"
                    type="email"
                    required
                    value={correo}
                    onChange={(e) => setCorreo(e.target.value)}
                    placeholder="amaro.gomez@example.com"
                    className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                  />
                </div>
              </div>

              {/* CAMPO CONDICIONAL DE ADULTO RESPONSABLE (Criterio 2) */}
              {esMenor && (
                <div className="p-3.5 rounded-xl bg-brand-mustard/15 border border-brand-mustard/40 space-y-1.5 animate-modal">
                  <div className="flex items-center gap-1.5 text-xs font-bold text-brand-navy">
                    <i data-lucide="shield-check" className="w-4 h-4 text-brand-mustard"></i>
                    <span>Persona adulta responsable (Obligatorio para menores de 18 años)</span>
                  </div>
                  <input
                    id="input-adulto"
                    name="name"
                    autoComplete="name"
                    type="text"
                    required={esMenor}
                    value={adultoResponsable}
                    onChange={(e) => setAdultoResponsable(e.target.value)}
                    placeholder="Nombre y apellido de la madre, padre o tutor…"
                    className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-paper text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                  />
                  <p className="text-[11px] text-brand-charcoal/60">
                    Requerido para comunicaciones oficiales y retiros de la escuela.
                  </p>
                </div>
              )}
            </div>

            {/* SELECCIÓN DE INSTRUMENTO Y CONTROL DE CUPOS */}
            <div className="pt-2 border-t border-brand-border/60 space-y-4">
              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="text-xs font-bold uppercase tracking-wider text-brand-navy">
                    Instrumento
                  </label>
                  <span className="text-xs text-brand-charcoal/60 font-music">
                    {cupoInfo.libres} lugares disponibles ({formatCLP(cupoInfo.mensualidad)}/mes)
                  </span>
                </div>
                <select
                  value={instrumento}
                  onChange={(e) => setInstrumento(e.target.value)}
                  className="w-full px-3 py-2.5 rounded-lg border border-brand-border bg-brand-cream/30 text-sm font-semibold text-brand-navy focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                >
                  {INSTRUMENTOS.map(i => {
                    const ocupados = alumnosExistentes.filter(a => {
                      if (alumnoEditando && a.id === alumnoEditando.id) return false;
                      return a.instrumento === i.nombre && (a.estado === 'Activo' || a.estado === 'Congelado');
                    }).length;
                    const libres = Math.max(0, i.cupo - ocupados);
                    return (
                      <option key={i.id} value={i.nombre}>
                        {i.nombre} — {libres === 0 ? '⛔ SIN CUPO (Lleno)' : `Quedan ${libres} de ${i.cupo} lugares`}
                      </option>
                    );
                  })}
                </select>

                {/* Aviso visual inmediato sobre el cupo */}
                {cupoInfo.lleno ? (
                  <p className="text-xs text-brand-rust font-bold mt-1.5 flex items-center gap-1">
                    <i data-lucide="alert-octagon" className="w-3.5 h-3.5"></i>
                    Instrumento lleno ({cupoInfo.total} de {cupoInfo.total}). No se puede guardar como Activo.
                  </p>
                ) : cupoInfo.libres <= 3 ? (
                  <p className="text-xs text-brand-mustard font-semibold mt-1 flex items-center gap-1">
                    <i data-lucide="alert-triangle" className="w-3.5 h-3.5"></i>
                    ¡Atención! Quedan solo {cupoInfo.libres} lugares en este instrumento.
                  </p>
                ) : null}
              </div>

              {/* DÍA Y HORA (Slots exactos de 45 min) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-brand-navy mb-1.5">
                    Día de clase
                  </label>
                  <select
                    value={dia}
                    onChange={(e) => setDia(e.target.value)}
                    className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                  >
                    {DIAS_SEMANA.map(d => (
                      <option key={d} value={d}>{d}</option>
                    ))}
                  </select>
                  <p className="text-[11px] text-brand-charcoal/50 mt-1">
                    {dia === 'Sábado' ? 'Horario de sábados: 9:30 a 13:30' : 'Horario lun-vie: 15:00 a 21:00'}
                  </p>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-brand-navy mb-1.5">
                    Hora (45 minutos)
                  </label>
                  <select
                    value={hora}
                    onChange={(e) => setHora(e.target.value)}
                    className="w-full px-3 py-2 rounded-lg border border-brand-border bg-brand-cream/30 text-sm font-semibold text-brand-navy focus:outline-none focus:ring-2 focus:ring-brand-mustard"
                  >
                    {horariosDisponibles.map(h => (
                      <option key={h} value={h}>{h} hs</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* ESTADO */}
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-brand-navy mb-1.5">
                  Estado de la ficha
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {['Activo', 'Congelado', 'Retirado'].map(st => (
                    <button
                      key={st}
                      type="button"
                      onClick={() => setEstado(st)}
                      className={`py-2 px-3 rounded-lg text-xs font-bold border transition ${
                        estado === st
                          ? st === 'Activo'
                            ? 'bg-brand-navy text-brand-paper border-brand-navy shadow-xs'
                            : st === 'Congelado'
                              ? 'bg-brand-mustard text-brand-navy border-brand-mustard shadow-xs'
                              : 'bg-brand-charcoal text-white border-brand-charcoal'
                          : 'bg-brand-cream/40 text-brand-charcoal/70 border-brand-border hover:bg-brand-subtle'
                      }`}
                    >
                      {st}
                    </button>
                  ))}
                </div>
                <p className="text-[11px] text-brand-charcoal/50 mt-1.5">
                  {estado === 'Activo' && 'Ocupa cupo y suma a la facturación mensual.'}
                  {estado === 'Congelado' && 'Conserva el cupo reservado pero NO suma al cobro mensual ($ 0).'}
                  {estado === 'Retirado' && 'Libera el cupo del instrumento de inmediato.'}
                </p>
              </div>

            </div>

            {/* BOTONES DE ACCIÓN */}
            <div className="pt-4 border-t border-brand-border/60 flex items-center justify-end gap-3">
              <button
                type="button"
                onClick={onCancelar}
                className="px-4 py-2 rounded-lg text-sm font-medium text-brand-charcoal/70 hover:bg-brand-subtle transition"
              >
                Cancelar
              </button>
              <button
                type="submit"
                className="px-6 py-2.5 rounded-lg bg-brand-navy text-brand-paper font-bold text-sm hover:brightness-110 active:scale-98 transition shadow-sm flex items-center gap-2"
              >
                <i data-lucide="check" className="w-4 h-4 text-brand-mustard"></i>
                <span>{alumnoEditando ? "Guardar cambios" : "Guardar ficha"}</span>
              </button>
            </div>

          </form>

        </div>
      );
    }

    // Renderizado en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
